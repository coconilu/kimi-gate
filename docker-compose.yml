services:
  gateway:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/kimi-gate.db
    volumes:
      - gateway-data:/data
    expose:
      - "3000"
    depends_on: []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env or environment}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway

volumes:
  gateway-data:
  caddy-data:
  caddy-config:
